[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hekmatai"
version = "0.0.1"
description = "HekmatAi: a continual-learning agent with context inference, evaluated in strictly separated benchmarks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hekmatai.own_benchmark" = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
